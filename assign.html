<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/style.css">
    <title>Assign Provider</title>
</head>
<body>

<h1>Assign Provider to Job</h1>

<form method="POST">
    <label>Select Job:</label><br>
    <select name="job_id">
        {% for job in jobs %}
        <option value="{{ job[0] }}">{{ job[1] }} - {{ job[3] }}</option>
        {% endfor %}
    </select><br><br>

    <label>Select Provider:</label><br>
    <select name="provider_id">
        {% for provider in providers %}
        <option value="{{ provider[0] }}">{{ provider[1] }} - {{ provider[2] }}</option>
        {% endfor %}
    </select><br><br>

    <label>Agreed Price:</label><br>
    <input type="number" step="0.01" name="agreed_price"><br><br>

    <button type="submit">Assign Provider</button>
</form>

<br>
<a href="/dashboard">Back to Dashboard</a>

</body>
</html>
